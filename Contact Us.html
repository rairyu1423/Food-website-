<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="Contact Us.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="row py-md-5 g-1">
        <div class="col-md-6 first_col">
          <h1 class="text-center mt-3">Contact Us</h1>
          <form class="p-4 mt-5">
            <div class="mb-3">
              <label for="nameInput" class="form-label"> Name</label>
              <input
                type="text"
                class="form-control"
                id="nameInput"
                placeholder="Enter Your Name"
                autofocus
                required
              />
            </div>
            <div class="mb-3">
              <label for="emailInput" class="form-label"> Email</label>
              <input
                type="email"
                class="form-control"
                id="emailInput"
                placeholder="Enter Your Email"
                required
              />
            </div>
            <div class="mb-3">
              <label for="messageInput" class="form-label"> Mail</label>
              <textarea
                class="form-control"
                id="messageInput"
                rows="3"
                placeholder="Whats Your Review"
              ></textarea>
            </div>
            <div class="mb-3">
              <button type="submit" class="btn btn-primary">Send</button>
            </div>
          </form>
        </div>
        <div class="last_row">
          <div class="row row-cols-1 row-cols-3 p-3">
            <div class="col">
              <h4>Address</h4>
              <p>
                Lalpur, Chakdaha, Nadia <br />
                Pin- 741222
              </p>
            </div>
            <div class="col">
              <h4>Contact Number</h4>
              <p>+91-7318988397</p>
            </div>
            <div class="col">
              <h4>E-Mail</h4>
              <p>anoyghosh992004@gmail.com</p>
            </div>
            <div class="media-icons text-center mt-3">
              <a href="#" class="main-icon"><i class="fab fa-facebook"></i></a>
              <a href="#" class="main-icon"><i class="fab fa-instagram"></i></a>
              <a href="#" class="main-icon"
                ><i class="fab fa-whatsapp" id="wp"></i
              ></a>
            </div>
          </div>
        </div>
      </div>
      <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"
      ></script>
    </div>
  </body>
</html>
